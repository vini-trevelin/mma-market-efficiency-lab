[project]
name = "mma-market-efficiency-lab"
version = "0.1.0"
description = "Local-first UFC/MMA data foundation with point-in-time fighter features."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "duckdb>=1.1.3",
  "fastapi>=0.115.6",
  "matplotlib>=3.9.3",
  "pandas>=2.2.3",
  "pyarrow>=18.1.0",
  "pydantic>=2.10.4",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "scikit-learn>=1.5.2",
  "uvicorn>=0.34.0",
  "xgboost>=2.1.3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4",
  "ruff>=0.8.4",
]

[project.scripts]
mma-eff-lab = "mma_eff_lab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mma_eff_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
